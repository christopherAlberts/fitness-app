<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Running figure stylized -->
  <g transform="translate(256, 256)">
    <!-- Body -->
    <circle cx="0" cy="-100" r="36" fill="white"/>
    
    <!-- Torso -->
    <path d="M0 -64 L-30 40 L30 40 Z" fill="white"/>
    
    <!-- Arms in running motion -->
    <path d="M-15 -40 L-70 20 L-60 35 L-10 -20" fill="white"/>
    <path d="M15 -40 L70 -20 L65 -5 L10 -25" fill="white"/>
    
    <!-- Legs in running motion -->
    <path d="M-20 40 L-60 120 L-45 130 L-5 55" fill="white"/>
    <path d="M20 40 L70 100 L60 115 L15 55" fill="white"/>
    
    <!-- Speed lines -->
    <rect x="-140" y="-20" width="50" height="6" rx="3" fill="url(#accent)"/>
    <rect x="-130" y="10" width="40" height="6" rx="3" fill="url(#accent)"/>
    <rect x="-135" y="40" width="45" height="6" rx="3" fill="url(#accent)"/>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="80" y="440" width="352" height="24" rx="12" fill="url(#accent)"/>
</svg>
