<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Full background for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Running figure stylized - centered for safe zone -->
  <g transform="translate(256, 256)">
    <!-- Body -->
    <circle cx="0" cy="-80" r="30" fill="white"/>
    
    <!-- Torso -->
    <path d="M0 -50 L-25 30 L25 30 Z" fill="white"/>
    
    <!-- Arms in running motion -->
    <path d="M-12 -30 L-55 15 L-47 27 L-8 -15" fill="white"/>
    <path d="M12 -30 L55 -15 L50 -3 L8 -20" fill="white"/>
    
    <!-- Legs in running motion -->
    <path d="M-16 30 L-48 95 L-36 103 L-4 42" fill="white"/>
    <path d="M16 30 L55 80 L47 92 L12 42" fill="white"/>
    
    <!-- Speed lines -->
    <rect x="-110" y="-15" width="40" height="5" rx="2.5" fill="url(#accent)"/>
    <rect x="-100" y="8" width="32" height="5" rx="2.5" fill="url(#accent)"/>
    <rect x="-105" y="31" width="36" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
</svg>
