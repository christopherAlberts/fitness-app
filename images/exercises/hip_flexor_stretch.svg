<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="135" x2="180" y2="135" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in lunge stretch -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="90" cy="35" r="10" fill="#4f46e5"/>
    <!-- Torso upright -->
    <line x1="90" y1="45" x2="90" y2="85"/>
    <!-- Arms relaxed at sides -->
    <line x1="90" y1="55" x2="75" y2="55"/>
    <line x1="75" y1="55" x2="70" y2="80"/>
    <line x1="90" y1="55" x2="105" y2="55"/>
    <line x1="105" y1="55" x2="110" y2="80"/>
    <!-- Front leg bent 90 degrees -->
    <line x1="90" y1="85" x2="60" y2="105"/>
    <line x1="60" y1="105" x2="55" y2="133"/>
    <circle cx="55" cy="133" r="4" fill="#6366f1"/>
    <!-- Back knee on ground -->
    <line x1="90" y1="85" x2="130" y2="110"/>
    <circle cx="130" cy="110" r="5" fill="#6366f1"/>
    <!-- Back foot behind -->
    <line x1="130" y1="110" x2="155" y2="105"/>
  </g>
  <!-- Hip flexor stretch indicator -->
  <ellipse cx="110" cy="95" rx="15" ry="10" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <!-- Stretch arrow -->
  <path d="M125 75 L135 65" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M130 70 L135 65 L130 60" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
