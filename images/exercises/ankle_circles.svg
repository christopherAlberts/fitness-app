<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person standing on one leg -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="90" cy="25" r="10" fill="#4f46e5"/>
    <!-- Torso -->
    <line x1="90" y1="35" x2="90" y2="75"/>
    <!-- Arms out for balance -->
    <line x1="90" y1="50" x2="65" y2="45"/>
    <line x1="90" y1="50" x2="115" y2="45"/>
    <!-- Standing leg -->
    <line x1="90" y1="75" x2="85" y2="110"/>
    <line x1="85" y1="110" x2="80" y2="138"/>
    <circle cx="80" cy="138" r="4" fill="#6366f1"/>
    <!-- Raised leg -->
    <line x1="90" y1="75" x2="110" y2="90"/>
    <line x1="110" y1="90" x2="130" y2="95"/>
  </g>
  <!-- Foot making circles -->
  <circle cx="140" cy="95" r="8" fill="#6366f1"/>
  <!-- Circle motion -->
  <circle cx="140" cy="95" r="18" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <!-- Rotation arrows -->
  <path d="M155 85 Q165 95 155 105" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M157 102 L155 108 L160 106" stroke="#10b981" stroke-width="2" fill="none"/>
  <!-- Ankle highlight -->
  <circle cx="130" cy="95" r="6" stroke="#10b981" stroke-width="1.5" fill="none"/>
</svg>
