<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Person doing cross-body shoulder stretch -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="35" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="100" y1="47" x2="100" y2="55"/>
    <!-- Torso -->
    <line x1="100" y1="55" x2="100" y2="100"/>
    <!-- Right arm across body -->
    <line x1="100" y1="65" x2="130" y2="65"/>
    <line x1="130" y1="65" x2="145" y2="80"/>
    <line x1="145" y1="80" x2="55" y2="80"/>
    <!-- Left arm pulling right arm -->
    <line x1="100" y1="65" x2="80" y2="65"/>
    <line x1="80" y1="65" x2="70" y2="85"/>
    <line x1="70" y1="85" x2="80" y2="80"/>
    <!-- Legs (partial) -->
    <line x1="100" y1="100" x2="90" y2="130"/>
    <line x1="100" y1="100" x2="110" y2="130"/>
  </g>
  <!-- Shoulder stretch indicator -->
  <ellipse cx="130" cy="70" rx="12" ry="10" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <!-- Pull arrow -->
  <path d="M60 75 L50 75 M55 70 L50 75 L55 80" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
