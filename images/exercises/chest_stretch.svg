<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Doorway frame -->
  <rect x="30" y="15" width="10" height="125" fill="#3f3f46"/>
  <rect x="30" y="10" width="80" height="8" fill="#3f3f46"/>
  <!-- Person in doorway stretch -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head looking forward -->
    <circle cx="85" cy="45" r="10" fill="#4f46e5"/>
    <!-- Torso stepping through -->
    <line x1="85" y1="55" x2="90" y2="95"/>
    <!-- Arm on doorframe -->
    <line x1="85" y1="65" x2="55" y2="55"/>
    <line x1="55" y1="55" x2="40" y2="45"/>
    <circle cx="40" cy="45" r="3" fill="#6366f1"/>
    <!-- Other arm relaxed -->
    <line x1="85" y1="70" x2="105" y2="75"/>
    <line x1="105" y1="75" x2="115" y2="95"/>
    <!-- Legs stepping forward -->
    <line x1="90" y1="95" x2="105" y2="120"/>
    <line x1="105" y1="120" x2="115" y2="140"/>
    <circle cx="115" cy="140" r="4" fill="#6366f1"/>
    <line x1="90" y1="95" x2="80" y2="120"/>
    <line x1="80" y1="120" x2="75" y2="140"/>
    <circle cx="75" cy="140" r="4" fill="#6366f1"/>
  </g>
  <!-- Chest stretch indicator -->
  <ellipse cx="70" cy="70" rx="15" ry="10" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <!-- Step forward arrow -->
  <path d="M125 100 L135 100 M130 95 L135 100 L130 105" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
