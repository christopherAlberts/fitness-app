<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Step/platform -->
  <rect x="60" y="115" width="80" height="15" rx="3" fill="#3f3f46"/>
  <!-- Ground -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person doing calf raise -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="20" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="100" y1="32" x2="100" y2="40"/>
    <!-- Torso -->
    <line x1="100" y1="40" x2="100" y2="80"/>
    <!-- Arms at sides -->
    <line x1="100" y1="45" x2="80" y2="45"/>
    <line x1="80" y1="45" x2="75" y2="75"/>
    <line x1="100" y1="45" x2="120" y2="45"/>
    <line x1="120" y1="45" x2="125" y2="75"/>
    <!-- Legs straight, on toes -->
    <line x1="100" y1="80" x2="90" y2="100"/>
    <line x1="90" y1="100" x2="90" y2="115"/>
    <circle cx="90" cy="115" r="4" fill="#6366f1"/>
    <line x1="100" y1="80" x2="110" y2="100"/>
    <line x1="110" y1="100" x2="110" y2="115"/>
    <circle cx="110" cy="115" r="4" fill="#6366f1"/>
  </g>
  <!-- Calf muscle highlight -->
  <ellipse cx="100" cy="105" rx="15" ry="8" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <!-- Up arrow -->
  <path d="M145 50 L145 35 M140 40 L145 35 L150 40" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
