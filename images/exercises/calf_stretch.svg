<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="135" x2="180" y2="135" stroke="#3f3f46" stroke-width="2"/>
  <!-- Wall -->
  <rect x="140" y="20" width="8" height="115" fill="#3f3f46"/>
  <!-- Person leaning into wall -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="105" cy="35" r="10" fill="#4f46e5"/>
    <!-- Torso leaning forward -->
    <line x1="105" y1="45" x2="120" y2="75"/>
    <!-- Arms on wall -->
    <line x1="110" y1="55" x2="135" y2="50"/>
    <circle cx="140" cy="50" r="3" fill="#6366f1"/>
    <line x1="115" y1="65" x2="135" y2="65"/>
    <circle cx="140" cy="65" r="3" fill="#6366f1"/>
    <!-- Front leg bent -->
    <line x1="120" y1="75" x2="115" y2="105"/>
    <line x1="115" y1="105" x2="120" y2="133"/>
    <circle cx="120" cy="133" r="4" fill="#6366f1"/>
    <!-- Back leg straight - calf stretch -->
    <line x1="120" y1="75" x2="70" y2="100"/>
    <line x1="70" y1="100" x2="55" y2="133"/>
    <circle cx="55" cy="133" r="4" fill="#6366f1"/>
  </g>
  <!-- Calf stretch indicator -->
  <ellipse cx="65" cy="115" rx="10" ry="15" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <!-- Heel down indicator -->
  <path d="M45 125 L45 135 M40 130 L45 135 L50 130" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
