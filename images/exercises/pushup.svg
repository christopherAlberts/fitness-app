<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="120" x2="180" y2="120" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in push-up position -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="45" cy="55" r="12" fill="#4f46e5"/>
    <!-- Torso -->
    <line x1="55" y1="60" x2="130" y2="75"/>
    <!-- Arms -->
    <line x1="60" y1="65" x2="55" y2="95"/>
    <line x1="55" y1="95" x2="55" y2="118"/>
    <circle cx="55" cy="118" r="4" fill="#6366f1"/>
    <!-- Back arm -->
    <line x1="90" y1="70" x2="95" y2="100"/>
    <line x1="95" y1="100" x2="95" y2="118"/>
    <circle cx="95" cy="118" r="4" fill="#6366f1"/>
    <!-- Legs -->
    <line x1="130" y1="75" x2="165" y2="85"/>
    <line x1="165" y1="85" x2="175" y2="118"/>
    <circle cx="175" cy="118" r="4" fill="#6366f1"/>
  </g>
  <!-- Arrow showing movement -->
  <path d="M45 35 L45 25 M40 30 L45 25 L50 30" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M45 75 L45 85 M40 80 L45 85 L50 80" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
