<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="135" x2="180" y2="135" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person standing with arms up -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="45" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="100" y1="57" x2="100" y2="65"/>
    <!-- Torso -->
    <line x1="100" y1="65" x2="100" y2="100"/>
    <!-- Arms overhead -->
    <line x1="100" y1="70" x2="75" y2="55"/>
    <line x1="75" y1="55" x2="60" y2="25"/>
    <line x1="100" y1="70" x2="125" y2="55"/>
    <line x1="125" y1="55" x2="140" y2="25"/>
    <!-- Legs -->
    <line x1="100" y1="100" x2="85" y2="135"/>
    <circle cx="85" cy="135" r="4" fill="#6366f1"/>
    <line x1="100" y1="100" x2="115" y2="135"/>
    <circle cx="115" cy="135" r="4" fill="#6366f1"/>
  </g>
  <!-- Barbell overhead -->
  <line x1="45" y1="25" x2="155" y2="25" stroke="#a1a1aa" stroke-width="3"/>
  <!-- Weight plates -->
  <rect x="40" y="15" width="12" height="20" rx="2" fill="#ef4444"/>
  <rect x="148" y="15" width="12" height="20" rx="2" fill="#ef4444"/>
  <!-- Arrow showing upward motion -->
  <path d="M100 8 L100 0 M95 4 L100 0 L105 4" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
