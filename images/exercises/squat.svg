<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in squat position -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="35" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="100" y1="47" x2="100" y2="52"/>
    <!-- Torso slightly leaned -->
    <line x1="100" y1="52" x2="95" y2="85"/>
    <!-- Arms holding bar -->
    <line x1="100" y1="55" x2="70" y2="45"/>
    <line x1="100" y1="55" x2="130" y2="45"/>
    <!-- Legs in squat -->
    <line x1="95" y1="85" x2="75" y2="110"/>
    <line x1="75" y1="110" x2="70" y2="140"/>
    <circle cx="70" cy="140" r="4" fill="#6366f1"/>
    <line x1="95" y1="85" x2="115" y2="110"/>
    <line x1="115" y1="110" x2="130" y2="140"/>
    <circle cx="130" cy="140" r="4" fill="#6366f1"/>
  </g>
  <!-- Barbell on shoulders -->
  <line x1="55" y1="45" x2="145" y2="45" stroke="#a1a1aa" stroke-width="3"/>
  <rect x="50" y="38" width="10" height="14" rx="2" fill="#ef4444"/>
  <rect x="140" y="38" width="10" height="14" rx="2" fill="#ef4444"/>
  <!-- Movement arrows -->
  <path d="M165 60 L165 45 M160 50 L165 45 L170 50" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M165 100 L165 115 M160 110 L165 115 L170 110" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
