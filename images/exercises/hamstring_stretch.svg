<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="135" x2="180" y2="135" stroke="#3f3f46" stroke-width="2"/>
  <!-- Raised surface for foot -->
  <rect x="110" y="95" width="40" height="8" rx="2" fill="#3f3f46"/>
  <!-- Person stretching -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="95" cy="45" r="10" fill="#4f46e5"/>
    <!-- Torso hinged forward -->
    <line x1="95" y1="55" x2="115" y2="85"/>
    <!-- Arms reaching toward foot -->
    <line x1="100" y1="60" x2="130" y2="75"/>
    <line x1="130" y1="75" x2="145" y2="85"/>
    <!-- Standing leg -->
    <line x1="115" y1="85" x2="85" y2="110"/>
    <line x1="85" y1="110" x2="80" y2="133"/>
    <circle cx="80" cy="133" r="4" fill="#6366f1"/>
    <!-- Stretched leg on surface -->
    <line x1="115" y1="85" x2="140" y2="80"/>
    <line x1="140" y1="80" x2="160" y2="93"/>
    <circle cx="160" cy="93" r="4" fill="#6366f1"/>
  </g>
  <!-- Hamstring stretch indicator -->
  <line x1="125" y1="78" x2="150" y2="88" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Reach arrow -->
  <path d="M150 75 L160 70" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M155 72 L160 70 L158 65" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
