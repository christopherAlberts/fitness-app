<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Pull-up bar -->
  <line x1="40" y1="20" x2="160" y2="20" stroke="#a1a1aa" stroke-width="4"/>
  <rect x="35" y="15" width="10" height="30" fill="#3f3f46"/>
  <rect x="155" y="15" width="10" height="30" fill="#3f3f46"/>
  <!-- Person pulling up -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="40" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="100" y1="52" x2="100" y2="58"/>
    <!-- Torso -->
    <line x1="100" y1="58" x2="100" y2="100"/>
    <!-- Arms gripping bar -->
    <line x1="100" y1="62" x2="75" y2="45"/>
    <line x1="75" y1="45" x2="70" y2="22"/>
    <circle cx="70" cy="22" r="3" fill="#6366f1"/>
    <line x1="100" y1="62" x2="125" y2="45"/>
    <line x1="125" y1="45" x2="130" y2="22"/>
    <circle cx="130" cy="22" r="3" fill="#6366f1"/>
    <!-- Legs -->
    <line x1="100" y1="100" x2="90" y2="130"/>
    <line x1="90" y1="130" x2="85" y2="145"/>
    <line x1="100" y1="100" x2="110" y2="130"/>
    <line x1="110" y1="130" x2="115" y2="145"/>
  </g>
  <!-- Arrow showing upward pull -->
  <path d="M100 25 L100 15" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M95 20 L100 15 L105 20" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
