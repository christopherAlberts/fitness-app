<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Machine frame -->
  <path d="M30 130 L30 40 L50 20 L170 20 L170 130" stroke="#3f3f46" stroke-width="3" fill="none"/>
  <!-- Seat -->
  <rect x="35" y="90" width="50" height="12" rx="3" fill="#3f3f46"/>
  <!-- Person on machine -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="50" cy="70" r="10" fill="#4f46e5"/>
    <!-- Torso reclined -->
    <line x1="55" y1="78" x2="70" y2="95"/>
    <!-- Legs pushing platform -->
    <line x1="70" y1="95" x2="100" y2="75"/>
    <line x1="100" y1="75" x2="130" y2="55"/>
    <circle cx="130" cy="55" r="4" fill="#6366f1"/>
    <line x1="70" y1="95" x2="105" y2="85"/>
    <line x1="105" y1="85" x2="130" y2="65"/>
    <circle cx="130" cy="65" r="4" fill="#6366f1"/>
  </g>
  <!-- Platform -->
  <rect x="125" y="45" width="35" height="30" rx="3" fill="#a1a1aa"/>
  <!-- Weight stack indicator -->
  <rect x="155" y="80" width="10" height="40" fill="#ef4444" rx="2"/>
  <!-- Push arrow -->
  <path d="M145 35 L155 25 M150 30 L155 25 L150 20" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
