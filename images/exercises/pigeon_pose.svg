<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground/mat -->
  <rect x="25" y="110" width="150" height="8" rx="2" fill="#3f3f46"/>
  <!-- Person in pigeon pose -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head down -->
    <circle cx="55" cy="85" r="10" fill="#4f46e5"/>
    <!-- Torso folded forward -->
    <line x1="63" y1="90" x2="95" y2="100"/>
    <!-- Arms extended forward -->
    <line x1="55" y1="90" x2="35" y2="100"/>
    <line x1="35" y1="100" x2="30" y2="108"/>
    <line x1="60" y1="92" x2="45" y2="105"/>
    <line x1="45" y1="105" x2="42" y2="108"/>
    <!-- Front leg folded (pigeon) -->
    <line x1="95" y1="100" x2="75" y2="108"/>
    <line x1="75" y1="108" x2="65" y2="108"/>
    <!-- Back leg extended -->
    <line x1="95" y1="100" x2="145" y2="95"/>
    <line x1="145" y1="95" x2="170" y2="100"/>
    <circle cx="170" cy="100" r="3" fill="#6366f1"/>
  </g>
  <!-- Glute/hip stretch indicator -->
  <ellipse cx="85" cy="100" rx="12" ry="8" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <!-- Hold text -->
  <text x="100" y="75" fill="#10b981" font-size="10" font-family="sans-serif" text-anchor="middle">HOLD</text>
</svg>
