<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person doing curl -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="30" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="100" y1="42" x2="100" y2="50"/>
    <!-- Torso -->
    <line x1="100" y1="50" x2="100" y2="95"/>
    <!-- Left arm curling up -->
    <line x1="100" y1="55" x2="75" y2="55"/>
    <line x1="75" y1="55" x2="65" y2="35"/>
    <!-- Right arm down -->
    <line x1="100" y1="55" x2="125" y2="55"/>
    <line x1="125" y1="55" x2="135" y2="90"/>
    <!-- Legs -->
    <line x1="100" y1="95" x2="85" y2="140"/>
    <circle cx="85" cy="140" r="4" fill="#6366f1"/>
    <line x1="100" y1="95" x2="115" y2="140"/>
    <circle cx="115" cy="140" r="4" fill="#6366f1"/>
  </g>
  <!-- Dumbbells -->
  <rect x="55" y="28" width="18" height="10" rx="2" fill="#a1a1aa"/>
  <rect x="52" y="30" width="6" height="6" rx="1" fill="#ef4444"/>
  <rect x="70" y="30" width="6" height="6" rx="1" fill="#ef4444"/>
  <rect x="128" y="85" width="18" height="10" rx="2" fill="#a1a1aa"/>
  <rect x="125" y="87" width="6" height="6" rx="1" fill="#ef4444"/>
  <rect x="143" y="87" width="6" height="6" rx="1" fill="#ef4444"/>
  <!-- Curl motion arrow -->
  <path d="M50 55 Q45 45 55 30" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M52 35 L55 30 L60 33" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
