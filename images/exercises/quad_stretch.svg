<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Wall for balance -->
  <rect x="50" y="20" width="5" height="120" fill="#3f3f46"/>
  <!-- Person doing standing quad stretch -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="90" cy="25" r="10" fill="#4f46e5"/>
    <!-- Torso upright -->
    <line x1="90" y1="35" x2="90" y2="80"/>
    <!-- Left arm on wall -->
    <line x1="90" y1="45" x2="65" y2="45"/>
    <line x1="65" y1="45" x2="55" y2="50"/>
    <!-- Right arm holding ankle behind -->
    <line x1="90" y1="50" x2="115" y2="55"/>
    <line x1="115" y1="55" x2="125" y2="85"/>
    <!-- Standing leg -->
    <line x1="90" y1="80" x2="85" y2="110"/>
    <line x1="85" y1="110" x2="80" y2="138"/>
    <circle cx="80" cy="138" r="4" fill="#6366f1"/>
    <!-- Stretched leg bent back -->
    <line x1="90" y1="80" x2="110" y2="90"/>
    <line x1="110" y1="90" x2="125" y2="75"/>
    <circle cx="125" cy="75" r="4" fill="#6366f1"/>
  </g>
  <!-- Quad stretch indicator -->
  <ellipse cx="105" cy="88" rx="12" ry="8" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <!-- Pull indicator -->
  <path d="M135 70 L145 65" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M140 67 L145 65 L143 60" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
