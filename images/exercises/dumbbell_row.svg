<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Bench -->
  <rect x="30" y="80" width="80" height="8" rx="2" fill="#3f3f46"/>
  <rect x="35" y="88" width="6" height="35" fill="#3f3f46"/>
  <rect x="99" y="88" width="6" height="35" fill="#3f3f46"/>
  <!-- Person in row position -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="55" cy="55" r="12" fill="#4f46e5"/>
    <!-- Torso bent over -->
    <line x1="65" y1="60" x2="130" y2="70"/>
    <!-- Left arm on bench -->
    <line x1="75" y1="65" x2="70" y2="78"/>
    <circle cx="70" cy="78" r="3" fill="#6366f1"/>
    <!-- Right arm rowing -->
    <line x1="115" y1="68" x2="140" y2="55"/>
    <line x1="140" y1="55" x2="150" y2="70"/>
    <!-- Left leg on bench -->
    <line x1="120" y1="68" x2="95" y2="78"/>
    <!-- Right leg on ground -->
    <line x1="130" y1="70" x2="155" y2="85"/>
    <line x1="155" y1="85" x2="160" y2="120"/>
    <circle cx="160" cy="120" r="4" fill="#6366f1"/>
  </g>
  <!-- Dumbbell -->
  <rect x="145" y="65" width="18" height="10" rx="2" fill="#a1a1aa"/>
  <rect x="142" y="67" width="6" height="6" rx="1" fill="#ef4444"/>
  <rect x="160" y="67" width="6" height="6" rx="1" fill="#ef4444"/>
  <!-- Arrow showing pulling motion -->
  <path d="M165 50 L165 40 M160 45 L165 40 L170 45" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
