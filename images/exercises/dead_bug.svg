<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="110" x2="180" y2="110" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person lying on back -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="45" cy="95" r="10" fill="#4f46e5"/>
    <!-- Torso on ground -->
    <line x1="55" y1="95" x2="120" y2="95"/>
    <!-- Right arm extended overhead -->
    <line x1="65" y1="95" x2="45" y2="60"/>
    <line x1="45" y1="60" x2="30" y2="40"/>
    <!-- Left arm up (at 90 degrees) -->
    <line x1="90" y1="95" x2="90" y2="65"/>
    <!-- Right leg extended -->
    <line x1="120" y1="95" x2="155" y2="75"/>
    <line x1="155" y1="75" x2="175" y2="55"/>
    <!-- Left leg up (at 90 degrees) -->
    <line x1="120" y1="95" x2="130" y2="70"/>
    <line x1="130" y1="70" x2="145" y2="65"/>
  </g>
  <!-- Alternating motion arrows -->
  <path d="M25 50 L20 40 M15 45 L20 40 L25 45" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M170 45 L175 35 M170 40 L175 35 L180 40" stroke="#10b981" stroke-width="2" fill="none"/>
  <!-- Core highlight -->
  <ellipse cx="100" cy="95" rx="20" ry="6" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
</svg>
