<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in lunge position -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="85" cy="30" r="12" fill="#4f46e5"/>
    <!-- Neck -->
    <line x1="85" y1="42" x2="85" y2="50"/>
    <!-- Torso upright -->
    <line x1="85" y1="50" x2="85" y2="90"/>
    <!-- Arms at sides -->
    <line x1="85" y1="55" x2="70" y2="55"/>
    <line x1="70" y1="55" x2="65" y2="85"/>
    <line x1="85" y1="55" x2="100" y2="55"/>
    <line x1="100" y1="55" x2="105" y2="85"/>
    <!-- Front leg bent -->
    <line x1="85" y1="90" x2="60" y2="110"/>
    <line x1="60" y1="110" x2="55" y2="140"/>
    <circle cx="55" cy="140" r="4" fill="#6366f1"/>
    <!-- Back leg extended -->
    <line x1="85" y1="90" x2="130" y2="115"/>
    <line x1="130" y1="115" x2="155" y2="130"/>
    <circle cx="155" cy="130" r="4" fill="#6366f1"/>
  </g>
  <!-- Forward motion arrow -->
  <path d="M170 90 L180 90 M175 85 L180 90 L175 95" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
