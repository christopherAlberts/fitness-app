<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="120" x2="180" y2="120" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in bridge position -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head on ground -->
    <circle cx="40" cy="105" r="10" fill="#4f46e5"/>
    <!-- Upper back on ground -->
    <line x1="50" y1="100" x2="70" y2="105"/>
    <!-- Torso raised -->
    <line x1="70" y1="105" x2="110" y2="65"/>
    <!-- Hips at top -->
    <circle cx="110" cy="65" r="5" fill="#10b981" opacity="0.5"/>
    <!-- Legs bent, feet on ground -->
    <line x1="110" y1="65" x2="130" y2="95"/>
    <line x1="130" y1="95" x2="135" y2="118"/>
    <circle cx="135" cy="118" r="4" fill="#6366f1"/>
    <line x1="110" y1="65" x2="145" y2="95"/>
    <line x1="145" y1="95" x2="155" y2="118"/>
    <circle cx="155" cy="118" r="4" fill="#6366f1"/>
    <!-- Arms on ground -->
    <line x1="55" y1="100" x2="55" y2="118"/>
    <line x1="65" y1="103" x2="70" y2="118"/>
  </g>
  <!-- Hip lift arrow -->
  <path d="M110 50 L110 35 M105 40 L110 35 L115 40" stroke="#10b981" stroke-width="2" fill="none"/>
  <!-- Glute highlight -->
  <ellipse cx="105" cy="70" rx="12" ry="8" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
</svg>
