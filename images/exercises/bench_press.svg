<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Bench -->
  <rect x="40" y="95" width="100" height="10" rx="3" fill="#3f3f46"/>
  <rect x="45" y="105" width="8" height="25" fill="#3f3f46"/>
  <rect x="127" y="105" width="8" height="25" fill="#3f3f46"/>
  <!-- Person lying on bench -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="50" cy="80" r="12" fill="#4f46e5"/>
    <!-- Torso on bench -->
    <line x1="60" y1="85" x2="125" y2="85"/>
    <!-- Arms holding bar -->
    <line x1="75" y1="85" x2="75" y2="55"/>
    <line x1="110" y1="85" x2="110" y2="55"/>
    <!-- Legs -->
    <line x1="125" y1="85" x2="145" y2="95"/>
    <line x1="145" y1="95" x2="150" y2="125"/>
    <circle cx="150" cy="125" r="4" fill="#6366f1"/>
  </g>
  <!-- Barbell -->
  <line x1="25" y1="55" x2="160" y2="55" stroke="#a1a1aa" stroke-width="3"/>
  <!-- Weight plates -->
  <rect x="20" y="45" width="12" height="20" rx="2" fill="#ef4444"/>
  <rect x="153" y="45" width="12" height="20" rx="2" fill="#ef4444"/>
  <!-- Movement arrows -->
  <path d="M92 40 L92 30 M87 35 L92 30 L97 35" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M92 70 L92 80 M87 75 L92 80 L97 75" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
