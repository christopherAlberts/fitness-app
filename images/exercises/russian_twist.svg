<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="130" x2="180" y2="130" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in V-sit position rotating -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="85" cy="45" r="10" fill="#4f46e5"/>
    <!-- Torso leaned back -->
    <line x1="90" y1="53" x2="100" y2="90"/>
    <!-- Arms rotated to side holding weight -->
    <line x1="95" y1="65" x2="55" y2="70"/>
    <line x1="95" y1="65" x2="70" y2="80"/>
    <!-- Legs raised -->
    <line x1="100" y1="90" x2="130" y2="75"/>
    <line x1="130" y1="75" x2="155" y2="80"/>
    <line x1="100" y1="90" x2="125" y2="85"/>
    <line x1="125" y1="85" x2="150" y2="95"/>
    <!-- Feet -->
    <circle cx="155" cy="80" r="3" fill="#6366f1"/>
    <circle cx="150" cy="95" r="3" fill="#6366f1"/>
  </g>
  <!-- Weight/medicine ball -->
  <circle cx="50" cy="72" r="10" fill="#ef4444"/>
  <!-- Rotation arrows -->
  <path d="M50 55 Q30 50 35 70" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M32 67 L35 73 L40 68" stroke="#10b981" stroke-width="2" fill="none"/>
  <!-- Oblique highlight -->
  <ellipse cx="95" cy="75" rx="10" ry="15" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,2" transform="rotate(-20 95 75)"/>
</svg>
