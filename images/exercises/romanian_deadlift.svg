<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#1a1a24"/>
  <!-- Ground line -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#3f3f46" stroke-width="2"/>
  <!-- Person in RDL position - hinging at hips -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="55" cy="50" r="12" fill="#4f46e5"/>
    <!-- Torso horizontal -->
    <line x1="65" y1="55" x2="115" y2="75"/>
    <!-- Arms hanging down with weight -->
    <line x1="85" y1="63" x2="85" y2="100"/>
    <!-- Legs slightly bent -->
    <line x1="115" y1="75" x2="115" y2="110"/>
    <line x1="115" y1="110" x2="110" y2="140"/>
    <circle cx="110" cy="140" r="4" fill="#6366f1"/>
    <line x1="115" y1="75" x2="125" y2="110"/>
    <line x1="125" y1="110" x2="130" y2="140"/>
    <circle cx="130" cy="140" r="4" fill="#6366f1"/>
  </g>
  <!-- Barbell hanging -->
  <line x1="60" y1="100" x2="110" y2="100" stroke="#a1a1aa" stroke-width="3"/>
  <rect x="55" y="93" width="10" height="14" rx="2" fill="#ef4444"/>
  <rect x="105" y="93" width="10" height="14" rx="2" fill="#ef4444"/>
  <!-- Hip hinge arrow -->
  <path d="M140 60 Q155 55 155 75" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M153 72 L155 78 L159 73" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
