<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="120" fill="url(#runGrad)" rx="16"/>
  <!-- Road lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="100" x2="80" y2="100" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="120" y1="100" x2="150" y2="100" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="190" y1="100" x2="220" y2="100" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="260" y1="100" x2="290" y2="100" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="330" y1="100" x2="360" y2="100" stroke="white" stroke-width="4" opacity="0.5"/>
  <!-- Runner silhouette -->
  <g fill="white" opacity="0.9">
    <circle cx="320" cy="35" r="12"/>
    <path d="M320 47 L315 75 L330 60 L340 85 L345 83 L335 55 L345 50 L320 47Z"/>
    <path d="M315 75 L295 95 L300 97 L318 78"/>
    <path d="M320 55 L300 50 L298 55 L318 60"/>
  </g>
  <!-- Speed lines -->
  <line x1="270" y1="45" x2="290" y2="45" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="275" y1="55" x2="295" y2="55" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="280" y1="65" x2="300" y2="65" stroke="white" stroke-width="2" opacity="0.3"/>
  <!-- Text -->
  <text x="30" y="50" fill="white" font-size="28" font-weight="bold" font-family="system-ui, sans-serif">Road Running</text>
  <text x="30" y="75" fill="white" font-size="14" opacity="0.8" font-family="system-ui, sans-serif">5K, 10K, Half Marathon Programs</text>
</svg>
