<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="weightsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="120" fill="url(#weightsGrad)" rx="16"/>
  <!-- Barbell background -->
  <g stroke="white" stroke-width="3" opacity="0.15">
    <line x1="50" y1="60" x2="350" y2="60"/>
    <rect x="40" y="40" width="25" height="40" rx="3"/>
    <rect x="335" y="40" width="25" height="40" rx="3"/>
  </g>
  <!-- Dumbbell icon -->
  <g fill="white" opacity="0.9">
    <rect x="290" y="35" width="12" height="50" rx="3"/>
    <rect x="350" y="35" width="12" height="50" rx="3"/>
    <rect x="300" y="50" width="52" height="20" rx="2"/>
    <rect x="282" y="42" width="12" height="36" rx="2"/>
    <rect x="358" y="42" width="12" height="36" rx="2"/>
  </g>
  <!-- Person silhouette lifting -->
  <g fill="white" opacity="0.3">
    <circle cx="200" cy="30" r="10"/>
    <path d="M200 40 L200 70 L185 100 L190 102 L200 75 L210 102 L215 100 L200 70Z"/>
    <path d="M200 50 L170 35 L165 40 L195 55"/>
    <path d="M200 50 L230 35 L235 40 L205 55"/>
  </g>
  <!-- Text -->
  <text x="30" y="50" fill="white" font-size="28" font-weight="bold" font-family="system-ui, sans-serif">Weightlifting</text>
  <text x="30" y="75" fill="white" font-size="14" opacity="0.8" font-family="system-ui, sans-serif">Full Body, Splits, Strength for Runners</text>
</svg>
